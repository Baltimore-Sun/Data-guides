<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Detainer requests by facility</title>
<style>
:root{--hl:#eef5ff;--accent:#ffbb00;--t2:#384350;--t3:#657180;--line:#dde2e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#000;font:14px/1.4 "Freight Sans Pro","Freight Sans","Helvetica Neue",Helvetica,Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:#000;margin:0}
:focus-visible{outline:2px solid #000;outline-offset:2px}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
main{padding:20px 28px 40px;min-width:0}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
h2{font-size:17px;margin:0 0 8px;font-weight:700}
.sub{margin:0 0 16px;color:var(--t2)}
.note{color:var(--t3);font-size:12px;margin:6px 0 0}
.note b{color:var(--t2)}
section{margin-bottom:34px}
/* controls */
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid #000;border-radius:3px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px}
.seg button+button{border-left:1px solid #000}
.seg button.on{background:var(--accent);font-weight:700}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.seg button:disabled{color:#a9b1ba;cursor:not-allowed;background:#fff}
.scope{margin:0 0 8px;font-weight:700}
.scope span{font-weight:400;color:var(--t2)}
.btn{border:1px solid #000;background:#fff;border-radius:3px;padding:4px 10px}
.btn:hover{background:var(--hl)}
.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
.lnk{border:0;background:none;padding:0;text-decoration:underline;color:var(--t2);font-size:12px}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--t2)}
/* table */
.tablewrap{overflow:auto;max-height:66vh;border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:#fff;border-bottom:2px solid #000;font-weight:700;white-space:normal;vertical-align:bottom;min-width:92px}
th button{border:0;background:none;padding:0;font-weight:700;text-align:inherit;width:100%}
th .arr{color:var(--t3);font-size:10px}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:#fff;min-width:230px;max-width:300px;white-space:normal;border-right:1px solid var(--line)}
th:first-child{z-index:3}
tbody tr:hover td{background:var(--hl)}
td.zero{color:var(--t3)}
tr.sep td{border-top:2px solid #000}
tr.tot td,td.totc,th.totc{background:var(--hl);font-weight:700}
tr.tot:hover td{background:#dfeaff}
tr.cmp td:first-child{font-style:italic}
tr.sub td:first-child{font-weight:700}
.empty{padding:28px;text-align:center;color:var(--t2);border:1px dashed var(--line)}
/* summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:10px 12px;background:var(--hl);border-left:4px solid var(--accent);margin-bottom:12px;font-size:13px}
.summary dt{color:var(--t3);white-space:nowrap}
.summary dd{margin:0;color:#000}
.summary dd.all{color:var(--t3)}
.summary .warn{color:#b00020;font-weight:700}
/* chart */
#legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 6px}
.lg{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lg.off{opacity:.35;text-decoration:line-through}
.lg svg{flex:none}
#chart{position:relative}
#chart svg{display:block;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #000;padding:6px 8px;font-size:12px;z-index:5;min-width:150px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tip .h{font-weight:700;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r span:first-child{display:flex;align-items:center;gap:5px}
.tip i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.tip .p{color:var(--t3);font-size:11px;margin-top:3px}
/* filters */
.fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fh strong{font-size:15px}
.fs{padding:10px 0;border-top:1px solid var(--line)}
.fs>.lab,.grp-h .lab{font-weight:700;font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.03em}
.fs>.lab{display:block;margin-bottom:6px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dates label{display:block;font-size:12px;color:var(--t3)}
.dates input{width:100%;padding:4px 6px;border:1px solid #999;border-radius:3px}
.grp{margin-top:8px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp-h .links{display:flex;gap:10px}
.opts{margin-top:4px}
.opt{display:flex;gap:7px;align-items:flex-start;padding:2px 0;line-height:1.25}
.opt input{margin-top:2px;flex:none}
.opt.dim,.opt.dim span{color:#a9b1ba}
.opt .tag{color:var(--t3);font-size:11px;margin-left:4px}
.opt .mem{display:block;color:var(--t3);font-size:11px;line-height:1.25;margin-top:1px}
.opt.dim .mem{color:#b9c0c8}
.gnote{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--line)}
.gnote div{margin:1px 0}
.acc>.grp-h button.head{border:0;background:none;padding:2px 0;width:100%;display:flex;justify-content:space-between;text-align:left}
.acc .opts{max-height:200px;overflow-y:auto;border:1px solid var(--line);padding:4px 6px}
.acc .val{color:var(--t3);font-size:12px}
.lgroup{display:flex;align-items:center;gap:6px;min-width:0}
.badge{background:var(--accent);color:#000;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;line-height:1.4;white-space:nowrap}
.arrow{color:var(--t3);font-size:12px;flex:none}
.picker{position:relative}
.picker input[type=search]{width:100%;padding:6px 8px;border:1px solid #999;border-radius:3px}
.drop{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid #000;max-height:250px;overflow-y:auto;padding:4px 8px;display:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.drop.show{display:block}
.drop .none{color:var(--t3);padding:4px 0}
.sel-h{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px;font-size:12px;color:var(--t2)}
.sel-h .links{display:flex;gap:10px}
.sel-list{max-height:210px;overflow-y:auto;border:1px solid var(--line);padding:4px 6px;font-size:13px}
.sel-list .none{color:var(--t3)}
.radios label{display:flex;gap:7px;align-items:center;padding:2px 0}
#filtBtn{display:none}
.hint{font-size:12px;color:#b00020;margin:4px 0 0}
@media (max-width:900px){
 .app{display:block}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:none}
 aside.open{display:block}
 #filtBtn{display:inline-block}
 main{padding:14px}
}
</style>
</head>
<body>
<div class="app">
<aside id="filters" aria-label="Filters">
  <div class="fh"><strong>Filters</strong><button class="btn" id="resetBtn" type="button">Reset all</button></div>

  <div class="fs">
    <span class="lab">Detainers</span>
    <div class="seg full" id="setSeg" role="group" aria-label="Detainer set">
      <button type="button" data-v="all" class="on">All detainers</button><button type="button" data-v="287" id="btn287">287(g) only</button>
    </div>
  </div>

  <div class="fs">
    <span class="lab">Detainer prepare date</span>
    <div class="dates">
      <label>Start<input type="date" id="dStart"></label>
      <label>End<input type="date" id="dEnd"></label>
    </div>
    <p class="hint" id="dateHint" hidden>Start date is after end date.</p>
  </div>

  <div class="fs">
    <span class="lab">Detention facilities</span>
    <div class="picker" id="facPicker">
      <input type="search" id="facSearch" placeholder="Search facilities to add or remove&#x2026;" autocomplete="off" aria-label="Search detention facilities">
      <div class="drop" id="facDrop"></div>
    </div>
    <div class="sel-h"><span id="facCount"></span>
      <span class="links"><button class="lnk" type="button" id="facAll">Select all</button><button class="lnk" type="button" id="facNone">Unselect all</button></span></div>
    <div class="sel-list" id="facList"></div>
  </div>

  <div class="fs">
    <span class="lab">Comparison facilities</span>
    <div class="radios" id="cmpRadios">
      <label><input type="radio" name="cmode" value="all" checked> All other facilities</label>
      <label><input type="radio" name="cmode" value="custom"> Choose facilities&#x2026;</label>
      <label><input type="radio" name="cmode" value="none"> None</label>
    </div>
    <div id="cmpCustom" hidden>
      <div class="picker" id="cmpPicker" style="margin-top:6px">
        <input type="search" id="cmpSearch" placeholder="Search comparison facilities&#x2026;" autocomplete="off" aria-label="Search comparison facilities">
        <div class="drop" id="cmpDrop"></div>
      </div>
      <div class="sel-h"><span id="cmpCount"></span><span class="links"><button class="lnk" type="button" id="cmpClear">Clear</button></span></div>
      <div class="sel-list" id="cmpList"></div>
    </div>
  </div>

  <div class="fs" id="mount-record"></div>
  <div class="fs" id="mount-attr"></div>
</aside>

<main>
  <header>
    <button class="btn" id="filtBtn" type="button" style="margin-bottom:10px">Show / hide filters</button>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <section id="tableSec">
    <p class="scope" id="scope"></p>
    <div class="bar">
      <div class="seg" id="modeSeg" role="group" aria-label="Table display">
        <button type="button" data-v="n" class="on">Counts</button><button type="button" data-v="p">Percent</button>
      </div>
      <label class="chk"><input type="checkbox" id="hideZero" checked> Hide facilities with no requests</label>
      <span class="grow"></span>
      <button class="btn" id="csvBtn" type="button">Download CSV</button>
    </div>
    <div id="tblBox"></div>
    <p class="note" id="tblNote"></p>
  </section>

  <section id="chartSec">
    <h2>Detainer requests over time</h2>
    <dl class="summary" id="summary"></dl>
    <div class="bar">
      <div class="seg" id="unitSeg" role="group" aria-label="Time unit">
        <button type="button" data-v="month" class="on">Months</button><button type="button" data-v="year">Years</button>
      </div>
      <label class="chk"><input type="checkbox" id="aggChk"> Aggregate selected facilities into one line</label>
    </div>
    <div id="legend"></div>
    <div id="chart"></div>
    <p class="note" id="chartNote"></p>
  </section>
  <p class="note" id="foot"></p>
</main>
</div>

function buildTable(m) {
  const s = ST, oR = okArr('reason');
  const cols = []; for (let r = 0; r < m.nR; r++) if (oR[r]) cols.push(r);
  const mk = (label, cells, kind) => ({label, cells, kind, total: cells.reduce((a, b) => a + b, 0)});
  let facRows = m.selFacs.map(f => mk(dict.fac[f], cols.map(r => m.selC[f * m.nR + r]), 'fac'));
  const hiddenZero = s.hideZero ? facRows.filter(r => r.total === 0).length : 0;
  if (s.hideZero) facRows = facRows.filter(r => r.total > 0);
  const val = r => {
    const sc = s.sort.col;
    if (sc === 'fac') return r.label.toLowerCase();
    if (sc === 'tot') return r.total;
    const k = cols.indexOf(sc); if (k < 0) return r.label.toLowerCase();
    return s.pct ? (r.total ? r.cells[k] / r.total : -1) : r.cells[k];
  };
  facRows.sort((a, b) => { const A = val(a), B = val(b); return (A < B ? -1 : A > B ? 1 : a.label.localeCompare(b.label)) * s.sort.dir; });
  const cellsOf = arrC => cols.map(r => arrC[r]);
  // "Selected facilities" always appears as its own subtotal row, whether or not a
  // comparison is shown. "Total" sums only what's presented here: selected facilities
  // plus the comparison row, when there is one - not every row in the dataset.
  const sel = mk('Selected facilities', cols.map((r, k) => m.selFacs.reduce((a, f) => a + m.selC[f * m.nR + r], 0)), 'sub sep');
  const special = [sel];
  let totalCells = sel.cells;
  if (s.cmode !== 'none') {
    const cmp = mk(s.cmode === 'all' ? 'All other facilities' : `Comparison facilities (${s.cfac.size})`, cellsOf(m.compC), 'cmp');
    special.push(cmp);
    totalCells = sel.cells.map((v, k) => v + cmp.cells[k]);
  }
  special.push(mk('Total', totalCells, 'tot sep'));
  return {cols, facRows, special, hiddenZero};
}

function renderTable(m) {
  const box = $('#tblBox'), s = ST;
  if (!m.selFacs.length) { box.innerHTML = '<div class="empty">Select at least one detention facility (or widen the Facility type, gov level, location or government filters).</div>'; $('#tblNote').textContent = ''; return; }
  const T = buildTable(m); M.table = T;
  if (!T.cols.length) { box.innerHTML = '<div class="empty">Select at least one detainer lift reason.</div>'; return; }
  const fmtC = (v, tot) => s.pct ? (tot ? (v / tot * 100).toFixed(1) + '%' : '\u2013') : fmt(v);
  const arrow = c => s.sort.col === c ? `<span class="arr">${s.sort.dir > 0 ? '\u25B2' : '\u25BC'}</span>` : '';
  let h = '<div class="tablewrap"><table><thead><tr>';
  h += `<th scope="col"><button type="button" data-sort="fac" style="text-align:left">Detention facility ${arrow('fac')}</button></th>`;
  T.cols.forEach(r => h += `<th scope="col"><button type="button" data-sort="${r}"${RMEM[dict.reason[r]] ? ` title="${esc(dict.reason[r] + ': ' + RMEM[dict.reason[r]].join('; '))}"` : ''}>${esc(dict.reason[r])} ${arrow(r)}</button></th>`);
  h += `<th scope="col" class="totc"><button type="button" data-sort="tot">Total ${arrow('tot')}</button></th></tr></thead><tbody>`;
  const row = r => {
    let x = `<tr class="${r.kind}"><td>${esc(r.label)}</td>`;
    r.cells.forEach(v => x += `<td class="${v === 0 ? 'zero' : ''}">${fmtC(v, r.total)}</td>`);
    return x + `<td class="totc">${fmt(r.total)}</td></tr>`;
  };
  T.facRows.forEach(r => h += row(r));
  T.special.forEach(r => h += row(r));
  box.innerHTML = h + '</tbody></table></div>';
  let note = s.pct ? 'Percent mode: each cell is the share of that row\u2019s total (sums to 100% across the columns shown). Totals are counts.' : '';
  if (T.hiddenZero) note += (note ? ' ' : '') + `${T.hiddenZero} selected facilit${T.hiddenZero === 1 ? 'y' : 'ies'} with no matching requests hidden.`;
  if (m.undated && m.fullRange) note += (note ? ' ' : '') + `${fmt(m.undated)} record(s) have no prepare date; they are counted in the table but not plotted.`;
  if (m.attrExcluded) note += (note ? ' ' : '') + `${fmt(m.attrExcluded)} record(s) don't match the current Facility type, gov level, location or government filters and are excluded from every row above, including Total.`;
  const gl = T.cols.map(r => dict.reason[r]).filter(n => RMEM[n]);
  $('#tblNote').innerHTML = esc(note) + (gl.length ? '<div class="gnote">' + gl.map(n => `<div><b>${esc(n)}</b> = ${esc(RMEM[n].join('; '))}</div>`).join('') + '</div>' : '');
}

function csvText() {
  const T = M && M.table; if (!T) return '';
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const f = (v, tot) => ST.pct ? (tot ? (v / tot * 100).toFixed(1) + '%' : '') : v;
  const lines = [['Detention facility'].concat(T.cols.map(r => dict.reason[r]), ['Total']).map(q).join(',')];
  T.facRows.concat(T.special).forEach(r => lines.push([q(r.label)].concat(r.cells.map(v => q(f(v, r.total))), [r.total]).join(',')));
  return lines.join('\n');
}

/* ---------- summary above chart ---------- */
function listText(names, total, max) {
  if (total !== null && names.length === total) return {t: 'All (' + total + ')', all: true};
  if (!names.length) return {t: 'None', all: false};
  const shown = names.slice(0, max).map(esc).join('; ');
  return {t: `${names.length}${total !== null ? ' of ' + total : ''}: ${shown}${names.length > max ? ` +${names.length - max} more` : ''}`, all: false};
}
function renderSummary(m) {
  const s = ST, rows = [];
  rows.push(['Detainers', s.only287 ? esc(FLAG) + ' detainers only' : 'All detainers', !s.only287]);
  const grp = g => { const idx = [...s.sets[g]].sort((a, b) => a - b); return listText(idx.map(i => dict[g][i]), dict[g].length, 5); };
  const dr = s.start > s.end ? '<span class="warn">Start date is after end date</span>' : `${fmtDate(s.start)} \u2013 ${fmtDate(s.end)}`;
  rows.push(['Prepare date', dr, s.start <= covStart && s.end >= covEnd]);
  const facNames = m.selFacs.map(f => dict.fac[f]);
  let ft = `${facNames.length} selected`;
  if (facNames.length) {
    const cap = s.facExpand ? facNames.length : 4;
    ft += ': ' + facNames.slice(0, cap).map(esc).join('; ');
    if (facNames.length > 4) ft += s.facExpand ? ' <button class="lnk" type="button" data-fx="0">show fewer</button>' : ` <button class="lnk" type="button" data-fx="1">+${facNames.length - 4} more</button>`;
  }
  rows.push(['Detention facilities', ft, false]);
  const cf = [...s.cfac].filter(f => !m.facChk[f] || !m.pool[f]).sort((a, b) => facOrder.indexOf(a) - facOrder.indexOf(b));
  rows.push(['Comparison', s.cmode === 'all' ? 'All other facilities' : s.cmode === 'none' ? 'None' : (cf.length ? listText(cf.map(f => dict.fac[f]), null, 3).t : 'None chosen'), s.cmode === 'all']);
  [['reason','Lift reason'],['type','Facility type'],['level','Facility gov level'],['loc','Facility location'],['gov','Facility government'],['crim','Criminality'],['threat','ICE-predicted threat level']].forEach(([g, lab]) => {
    const r = grp(g); rows.push([lab, esc(r.t), r.all]);
  });
  rows.push(['Chart', `${s.unit === 'month' ? 'Monthly' : 'Yearly'} counts; ${s.agg ? 'selected facilities combined into one line' : 'one line per selected facility'}`, false]);
  $('#summary').innerHTML = rows.map(r => `<dt>${r[0]}</dt><dd class="${r[2] ? 'all' : ''}">${r[1]}</dd>`).join('');
}

/* ---------- chart ---------- */
const PAL = ['#0072B2','#D55E00','#009E73','#CC79A7','#E69F00','#56B4E9','#7B3294','#8C6D31','#B2182B','#4D9221'];
const CMP_COLOR = '#384350', AGG_COLOR = '#0072B2', MAXL = 10;

function niceStep(max) {
  const t = max / 4, p = Math.pow(10, Math.floor(Math.log10(t))), f = t / p;
  return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p);
}
function chartSeries(m) {
  const s = ST, per = m.per, nP = per.n, out = []; let capped = 0;
  if (s.agg) out.push({key:'__agg', label:`Selected facilities (${m.selFacs.length})`, color:AGG_COLOR, dash:'', vals:Array.from(m.serAgg.slice(0, nP))});
  else {
    let list = m.selFacs.map(f => ({key:'f' + f, label:dict.fac[f], vals:Array.from(m.serFac.slice(f * nP, f * nP + nP))}));
    list.forEach(x => x.total = x.vals.reduce((a, b) => a + b, 0));
    list = list.filter(x => x.total > 0).sort((a, b) => b.total - a.total || a.label.localeCompare(b.label));
    if (list.length > MAXL) { capped = list.length - MAXL; list = list.slice(0, MAXL); }
    list.forEach((x, i) => { x.color = PAL[i % PAL.length]; x.dash = ''; out.push(x); });
  }
  if (s.cmode !== 'none') {
    const nCmp = s.cmode === 'custom' ? [...s.cfac].filter(f => !m.facChk[f] || !m.pool[f]).length : 0;
    out.push({key:'__cmp', label: s.cmode === 'all' ? 'All other facilities' : `Comparison facilities (${nCmp})`, color:CMP_COLOR, dash:'7 4', vals:Array.from(m.serComp.slice(0, nP))});
  }
  return {series: out, capped};
}
function pathFor(vals, xs, ys, a, b) { let d = ''; for (let i = a; i <= b; i++) d += (i === a ? 'M' : 'L') + xs(i).toFixed(1) + ',' + ys(vals[i]).toFixed(1); return d; }

function renderChart(m) {
  const box = $('#chart'), leg = $('#legend'), per = m.per, s = ST;
  if (!m.selFacs.length || per.n === 0) {
    leg.innerHTML = ''; $('#chartNote').textContent = '';
    box.innerHTML = '<div class="empty">' + (!m.selFacs.length ? 'Select at least one detention facility to see the chart.' : 'No dates in range.') + '</div>'; return;
  }
  const {series, capped} = chartSeries(m);
  leg.innerHTML = series.map(x => `<button type="button" class="lg ${s.hidden.has(x.key) ? 'off' : ''}" data-k="${x.key}" title="Click to show/hide"><svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="${x.color}" stroke-width="3" ${x.dash ? `stroke-dasharray="${x.dash}"` : ''}/></svg>${esc(x.label)}</button>`).join('');
  const vis = series.filter(x => !s.hidden.has(x.key));
  const W = Math.max(box.clientWidth || 820, 320), H = 380, ml = 50, mr = 14, mt = 12, mb = 46, iw = W - ml - mr, ih = H - mt - mb, n = per.n;
  let max = 0; vis.forEach(x => x.vals.forEach(v => { if (v > max) max = v; }));
  if (max === 0) max = 1;
  const step = niceStep(max), ymax = Math.ceil(max / step) * step;
  const xs = i => ml + (n === 1 ? iw / 2 : i * iw / (n - 1)), ys = v => mt + ih - (v / ymax) * ih;
  let g = '';
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    g += `<line x1="${ml}" x2="${W - mr}" y1="${ys(v)}" y2="${ys(v)}" stroke="${v === 0 ? '#000' : '#dde2e8'}"/>`;
    g += `<text x="${ml - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="#384350">${fmt(v)}</text>`;
  }
  const maxLabels = Math.max(2, Math.floor(iw / (s.unit === 'month' ? 62 : 48))), k = Math.ceil(n / maxLabels);
  for (let i = 0; i < n; i += k) g += `<text x="${xs(i)}" y="${H - mb + 18}" text-anchor="middle" font-size="11" fill="#384350">${esc(per.labels[i])}</text><line x1="${xs(i)}" x2="${xs(i)}" y1="${mt + ih}" y2="${mt + ih + 4}" stroke="#000"/>`;
  g += `<text x="12" y="${mt + ih / 2}" transform="rotate(-90 12 ${mt + ih / 2})" text-anchor="middle" font-size="11" fill="#657180">Detainer requests</text>`;
  vis.slice().reverse().forEach(x => {
    // split into runs of full / partial segments
    let i = 0;
    if (n === 1) g += `<circle cx="${xs(0)}" cy="${ys(x.vals[0])}" r="4" fill="${x.color}"/>`;
    while (i < n - 1) {
      const part = per.partial[i] || per.partial[i + 1]; let j = i + 1;
      while (j < n - 1 && (per.partial[j] || per.partial[j + 1]) === part) j++;
      g += `<path d="${pathFor(x.vals, xs, ys, i, j)}" fill="none" stroke="${x.color}" stroke-width="2.4" stroke-linejoin="round" ${x.dash ? `stroke-dasharray="${x.dash}"` : ''} opacity="${part ? .4 : 1}"/>`;
      i = j;
    }
    for (let p = 0; p < n; p++) if (per.partial[p]) g += `<circle cx="${xs(p)}" cy="${ys(x.vals[p])}" r="4" fill="#fff" stroke="${x.color}" stroke-width="2"/>`;
    else if (s.unit === 'year') g += `<circle cx="${xs(p)}" cy="${ys(x.vals[p])}" r="3" fill="${x.color}"/>`;
  });
  g += `<g id="hov" style="display:none"><line id="hovLine" y1="${mt}" y2="${mt + ih}" stroke="#657180" stroke-dasharray="3 3"/></g>`;
  box.innerHTML = `<svg id="svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of detainer requests over time">${g}<rect id="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" id="tip" style="display:none"></div>`;
  const svg = $('#svg'), hov = $('#hov'), hl = $('#hovLine'), tip = $('#tip');
  function show(ev) {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / (r.width || W));
    const i = Math.max(0, Math.min(n - 1, Math.round((px - ml) / iw * (n - 1 || 1)))); if (!isFinite(i)) return;
    hl.setAttribute('x1', xs(i)); hl.setAttribute('x2', xs(i));
    hov.querySelectorAll('circle').forEach(c => c.remove());
    vis.forEach(x => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', xs(i)); c.setAttribute('cy', ys(x.vals[i])); c.setAttribute('r', 4); c.setAttribute('fill', x.color); c.setAttribute('stroke', '#fff'); hov.appendChild(c); });
    hov.style.display = '';
    let h = `<div class="h">${esc(per.labels[i])}</div>`;
    vis.slice().sort((a, b) => b.vals[i] - a.vals[i]).forEach(x => h += `<div class="r"><span><i style="background:${x.color}"></i>${esc(x.label)}</span><b>${fmt(x.vals[i])}</b></div>`);
    if (per.partial[i]) h += `<div class="p">Partial period: ${fmtDate(Math.max(per.a, per.start[i]))} \u2013 ${fmtDate(Math.min(per.b, per.end[i]))}</div>`;
    tip.innerHTML = h; tip.style.display = '';
    const bw = box.clientWidth, tx = xs(i) * (bw / W), tw = tip.offsetWidth || 180;
    tip.style.left = (tx + 14 + tw > bw ? Math.max(0, tx - tw - 14) : tx + 14) + 'px'; tip.style.top = '10px';
  }
  const hit = $('#hit');
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { hov.style.display = 'none'; tip.style.display = 'none'; });

  let note = 'Click a legend item to show or hide its line.';
  const cmpS = vis.find(x => x.key === '__cmp'), othS = vis.filter(x => x.key !== '__cmp');
  if (cmpS && othS.length) {
    const cm = Math.max.apply(null, cmpS.vals), om = Math.max.apply(null, othS.map(x => Math.max.apply(null, x.vals)));
    if (cm > om * 3) note = '<b>The comparison line is much larger than the others.</b> Click its legend entry to hide it and rescale the chart. ' + note;
  }
  if (capped) note = `<b>Showing the ${MAXL} facilities with the most requests (${capped} more not drawn).</b> Use \u201cAggregate\u201d to combine all selected facilities. ` + note;
  const pp = []; per.partial.forEach((p, i) => { if (p) pp.push(`${per.labels[i]} (${fmtDate(Math.max(per.a, per.start[i]))} \u2013 ${fmtDate(Math.min(per.b, per.end[i]))})`); });
  if (pp.length) note += ` Faded lines and hollow markers show partial periods: ${pp.join('; ')}.`;
  if (m.undated) note += ` ${fmt(m.undated)} record(s) without a prepare date are not plotted.`;
  $('#chartNote').innerHTML = note;
}

/* ---------- filter UI ---------- */
const refs = {};
function buildGroup(g, mount) {
  const G = GROUPS[g], wrap = document.createElement('div');
  wrap.className = 'grp' + (G.acc ? ' acc' : ''); wrap.dataset.g = g;
  const links = '<span class="links"><button class="lnk" type="button" data-act="all">All</button><button class="lnk" type="button" data-act="none">None</button></span>';
  wrap.innerHTML = G.acc
    ? `<div class="grp-h"><button type="button" class="head" aria-expanded="false"><span class="lgroup"><span class="lab">${G.label}</span><span class="badge" hidden></span></span><span class="arrow">\u25BE</span></button></div><div class="opts" hidden><div style="text-align:right;margin-bottom:2px">${links}</div>${dict[g].map((v, i) => `<label class="opt" data-i="${i}"><input type="checkbox"><span>${optLabel(g, v)}</span></label>`).join('')}</div>`
    : `<div class="grp-h"><span class="lgroup"><span class="lab">${G.label}</span><span class="badge" hidden></span></span>${links}</div><div class="opts">${dict[g].map((v, i) => `<label class="opt" data-i="${i}"><input type="checkbox"><span>${optLabel(g, v)}</span></label>`).join('')}</div>`;
  mount.appendChild(wrap);
  refs[g] = {wrap, labels: [...wrap.querySelectorAll('label.opt')], badge: wrap.querySelector('.badge')};
  wrap.addEventListener('change', e => {
    const lab = e.target.closest('label.opt'); if (!lab) return;
    const i = +lab.dataset.i; e.target.checked ? ST.sets[g].add(i) : ST.sets[g].delete(i);
    onGroupChange(g);
  });
  wrap.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act) { ST.sets[g] = b.dataset.act === 'all' ? allSet(g) : new Set(); onGroupChange(g); }
    else if (b.classList.contains('head')) { const o = wrap.querySelector('.opts'); o.hidden = !o.hidden; b.setAttribute('aria-expanded', String(!o.hidden)); }
  });
}
function onGroupChange(g) {
  if (GROUPS[g].kind === 'attr') { const np = poolOnly(); for (let f = 0; f < np.length; f++) if (np[f] && !(lastPool && lastPool[f])) ST.fac.add(f); }
  update();
}
function syncGroups(m) {
  Object.keys(GROUPS).forEach(g => {
    const R = refs[g];
    R.labels.forEach(l => {
      const i = +l.dataset.i, inp = l.firstChild, on = ST.sets[g].has(i), pres = !!m.present[g][i];
      inp.checked = on; l.classList.toggle('dim', !pres); inp.disabled = !pres && !on;
      l.title = pres ? '' : 'No records match the other current filters';
    });
    if (R.badge) {
      const total = dict[g].length, sel = ST.sets[g].size, filtered = sel !== total;
      R.badge.hidden = !filtered;
      if (filtered) R.badge.textContent = sel + ' of ' + total;
    }
  });
}

function makePicker(o) {
  const input = $(o.input), drop = $(o.drop);
  function render() {
    const q = input.value.trim().toLowerCase();
    let ids = o.candidates().filter(f => !q || dict.fac[f].toLowerCase().includes(q));
    const more = ids.length > 80; ids = ids.slice(0, 80);
    drop.innerHTML = ids.length ? ids.map(f => { const dis = o.disabled(f); return `<label class="opt ${dis ? 'dim' : ''}" data-f="${f}"><input type="checkbox" ${o.checked(f) ? 'checked' : ''} ${dis ? 'disabled' : ''}><span>${esc(dict.fac[f])}${dis ? '<span class="tag">excluded by other filters</span>' : ''}</span></label>`; }).join('') + (more ? '<div class="none">Keep typing to narrow results\u2026</div>' : '') : '<div class="none">No matching facilities</div>';
  }
  input.addEventListener('focus', () => { render(); drop.classList.add('show'); });
  input.addEventListener('input', () => { render(); drop.classList.add('show'); });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') { drop.classList.remove('show'); input.blur(); } });
  drop.addEventListener('change', e => { const l = e.target.closest('label.opt'); if (l) { o.toggle(+l.dataset.f, e.target.checked); } });
  document.addEventListener('pointerdown', e => { if (!drop.parentNode.contains(e.target)) drop.classList.remove('show'); });

}
let facPicker, cmpPicker;
function renderFacUI(m) {

  $('#facList').innerHTML = m.selFacs.length ? m.selFacs.map(f => `<label class="opt" data-f="${f}"><input type="checkbox" checked><span>${esc(dict.fac[f])}</span></label>`).join('') : '<div class="none">None selected. Search above or use Select all.</div>';
  const effSel = f => m.facChk[f] && m.pool[f];
  const cf = [...ST.cfac].filter(f => !effSel(f)).sort((a, b) => facOrder.indexOf(a) - facOrder.indexOf(b));
  $('#cmpCount').textContent = `Comparison (${cf.length})`;
  $('#cmpList').innerHTML = cf.length ? cf.map(f => `<label class="opt" data-f="${f}"><input type="checkbox" checked><span>${esc(dict.fac[f])}</span></label>`).join('') : '<div class="none">None chosen.</div>';

}

/* ---------- orchestration ---------- */
let queued = false;
function update() { if (queued) return; queued = true; requestAnimationFrame(run); }
function run() {
  queued = false;
  M = compute(); lastPool = M.pool;
  // a facility that is now selected can't also be a comparison facility
  [...ST.cfac].forEach(f => { if (M.facChk[f] && M.pool[f]) ST.cfac.delete(f); });
  const b287 = $('#btn287'); b287.disabled = !M.has287 && !ST.only287;
  b287.title = b287.disabled ? 'No 287(g) detainers match the other current filters' : '';
  $('#scope').innerHTML = ST.only287 ? esc(FLAG) + ' detainers only <span>(other detainers hidden)</span>' : 'All detainers';
  syncGroups(M); renderFacUI(M); renderTable(M); renderSummary(M); renderChart(M);
  $('#dateHint').hidden = ST.start <= ST.end;
}
function syncControls() {
  $('#dStart').value = day2iso(ST.start); $('#dEnd').value = day2iso(ST.end);
  $('#hideZero').checked = ST.hideZero; $('#aggChk').checked = ST.agg;
  document.querySelectorAll('#setSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '287') === ST.only287));
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'p') === ST.pct));
  document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === ST.unit));
  document.querySelectorAll('input[name=cmode]').forEach(r => r.checked = r.value === ST.cmode);
  $('#cmpCustom').hidden = ST.cmode !== 'custom';
}

function init() {
  $('#title').textContent = D.meta.title || 'Detainer requests by facility';
  document.title = $('#title').textContent;
  $('#subtitle').textContent = `${fmt(N)} records by detainer prepare date, ${fmtDate(covStart)} \u2013 ${fmtDate(covEnd)}`;
  $('#foot').textContent = [D.meta.source, D.meta.generated ? 'Dashboard built ' + D.meta.generated : ''].filter(Boolean).join(' \u00B7 ');
  ['reason', 'crim', 'threat'].forEach(g => buildGroup(g, $('#mount-record')));
  ['type', 'level', 'loc', 'gov'].forEach(g => buildGroup(g, $('#mount-attr')));
  $('#dStart').min = $('#dEnd').min = day2iso(covStart); $('#dStart').max = $('#dEnd').max = day2iso(covEnd);
  lastPool = poolOnly();

  facPicker = makePicker({input:'#facSearch', drop:'#facDrop', candidates:() => facOrder,
    checked: f => ST.fac.has(f), disabled: f => !(lastPool && lastPool[f]),
    toggle: (f, on) => { on ? ST.fac.add(f) : ST.fac.delete(f); update(); }});
  cmpPicker = makePicker({input:'#cmpSearch', drop:'#cmpDrop',
    candidates: () => facOrder.filter(f => !(ST.fac.has(f) && lastPool && lastPool[f])),
    checked: f => ST.cfac.has(f), disabled: () => false,
    toggle: (f, on) => { on ? ST.cfac.add(f) : ST.cfac.delete(f); update(); }});

  $('#facList').addEventListener('change', e => { const l = e.target.closest('label.opt'); if (l && !e.target.checked) { ST.fac.delete(+l.dataset.f); update(); } });
  $('#cmpList').addEventListener('change', e => { const l = e.target.closest('label.opt'); if (l && !e.target.checked) { ST.cfac.delete(+l.dataset.f); update(); } });
  $('#facAll').onclick = () => { for (let f = 0; f < lastPool.length; f++) if (lastPool[f]) ST.fac.add(f); update(); };
  $('#facNone').onclick = () => { for (let f = 0; f < lastPool.length; f++) if (lastPool[f]) ST.fac.delete(f); update(); };
  $('#cmpClear').onclick = () => { ST.cfac.clear(); update(); };
  document.querySelectorAll('input[name=cmode]').forEach(r => r.addEventListener('change', () => { ST.cmode = r.value; syncControls(); update(); }));

  const setDate = (k, id) => $(id).addEventListener('change', e => { if (e.target.value) { ST[k] = iso2day(e.target.value); update(); } else e.target.value = day2iso(ST[k]); });
  setDate('start', '#dStart'); setDate('end', '#dEnd');
  $('#setSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; ST.only287 = b.dataset.v === '287'; ST.hidden.clear(); syncControls(); update(); });
  $('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ST.pct = b.dataset.v === 'p'; syncControls(); update(); });
  $('#unitSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ST.unit = b.dataset.v; ST.hidden.clear(); syncControls(); update(); });
  $('#aggChk').addEventListener('change', e => { ST.agg = e.target.checked; ST.hidden.clear(); update(); });
  $('#hideZero').addEventListener('change', e => { ST.hideZero = e.target.checked; update(); });
  $('#tblBox').addEventListener('click', e => {
    const b = e.target.closest('button[data-sort]'); if (!b) return;
    const c = b.dataset.sort === 'fac' || b.dataset.sort === 'tot' ? b.dataset.sort : +b.dataset.sort;
    ST.sort = ST.sort.col === c ? {col:c, dir:-ST.sort.dir} : {col:c, dir: c === 'fac' ? 1 : -1};
    update();
  });
  $('#legend').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return; const k = b.dataset.k; ST.hidden.has(k) ? ST.hidden.delete(k) : ST.hidden.add(k); update(); });
  $('#summary').addEventListener('click', e => { const b = e.target.closest('button[data-fx]'); if (!b) return; ST.facExpand = b.dataset.fx === '1'; update(); });
  $('#resetBtn').onclick = () => { ST = defaultState(); $('#facSearch').value = ''; $('#cmpSearch').value = ''; syncControls(); update(); };
  $('#filtBtn').onclick = () => $('#filters').classList.toggle('open');
  $('#csvBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csvText()], {type:'text/csv'})); a.download = 'detainers_table.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  if (window.ResizeObserver) { let lw = 0; new ResizeObserver(() => { const w = $('#chart').clientWidth; if (M && Math.abs(w - lw) > 4) { lw = w; renderChart(M); } }).observe($('#chart')); }
  syncControls(); run();
}
init();
})();
</script>
</body>
</html>
